server.port=8080

# Application info
spring.application.name=LMS-Security-Core

# H2 Database (Ready out-of-the-box, data persisted to file in target folder or in-memory)
spring.datasource.url=jdbc:h2:file:./data/lmsdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# H2 Console (Disabled in production / for security demo, toggleable)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL configuration template (uncomment when using MySQL)
# spring.datasource.url=jdbc:mysql://localhost:3306/lms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=rootpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# PostgreSQL configuration template (uncomment when using PostgreSQL)
# spring.datasource.url=jdbc:postgresql://localhost:5432/lms_db
# spring.datasource.username=postgres
# spring.datasource.password=postgrespassword
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB
lms.file.upload-dir=./uploads/submissions

# JWT Security Properties
lms.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
lms.jwt.expiration-ms=86400000

# Error Handling Configuration
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
